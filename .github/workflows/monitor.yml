name: Check SAPADA

on:
  schedule:
    - cron: "2-59/5 * * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Run health check
        env:
          MONITOR_TOKEN: ${{ secrets.MONITOR_TOKEN }}
          STATUS_URL: ${{ vars.STATUS_URL }}
        run: |
          test -n "$MONITOR_TOKEN"
          test -n "$STATUS_URL"
          curl --fail --show-error --silent \
            --max-time 25 \
            --retry 2 \
            --retry-delay 2 \
            -X POST \
            -H "Authorization: Bearer $MONITOR_TOKEN" \
            -H "Content-Type: application/json" \
            "$STATUS_URL/api/check"
